name: Secret scan

# .gitignore keeps .env files and private keys out of the tree by name. It cannot
# see a token pasted into a YAML value, a password in a script, or a credential
# that was committed once and removed later - git keeps that forever.
# gitleaks scans the whole history, which is the part a file-name rule cannot do.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pinned to a commit SHA, not a tag: a tag is a moving reference the
        # upstream owner can repoint, so a retag would execute unreviewed code here.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: a secret committed and removed is still in the objects,
          # and a shallow clone would report the repository clean.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organisation accounts.
